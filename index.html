<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#070d24; --panel:#101c44; --line:rgba(255,255,255,.14);
    --gold:#ffcf3f; --blue:#3ba0ff; --orange:#ff9b2f;
    --grass-a:#2f9e4f; --grass-b:#268a45; --chalk:rgba(255,255,255,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Rubik,system-ui,sans-serif;background:#04081a;color:#fff;overflow:hidden;
    display:grid;place-items:center;-webkit-font-smoothing:antialiased;
  }
  #app{
    position:relative;display:flex;flex-direction:column;background:var(--night);overflow:hidden;
    width:min(100vw,calc(100vh * 9 / 16));height:min(100vh,calc(100vw * 16 / 9));
  }
  body[data-layout="4:5"]  #app{width:min(100vw,calc(100vh * 4 / 5));height:min(100vh,calc(100vw * 5 / 4))}
  body[data-layout="1:1"]  #app{width:min(100vw,100vh);height:min(100vw,100vh)}
  body[data-layout="16:9"] #app{width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16))}
  body[data-layout="fill"] #app{width:100vw;height:100vh}

  /* ---------- top bar ---------- */
  .top{
    flex:0 0 auto;text-align:center;padding:7px 10px 6px;
    background:linear-gradient(180deg,#0d1a45,#0a1436);
    border-bottom:2px solid var(--line);
  }
  .top .rd{font-family:Anton,Rubik,sans-serif;letter-spacing:.05em;color:var(--gold);
    font-size:clamp(14px,2.6vh,24px);text-shadow:0 2px 0 #6b3d00}
  .top .ttl{font-size:clamp(10px,1.7vh,14px);opacity:.85;font-weight:700;margin-top:1px}

  /* ---------- tug bar ---------- */
  .tug{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:#0a1436;border-bottom:2px solid var(--line);
  }
  .tug .sc{font-family:Anton,sans-serif;font-size:clamp(22px,4.4vh,44px);line-height:1;min-width:1.4em;text-align:center}
  .tug .sc.a{color:var(--blue)}.tug .sc.b{color:var(--orange)}
  .barwrap{flex:1;position:relative;height:clamp(14px,2.6vh,26px);border-radius:99px;overflow:hidden;
    background:var(--orange);box-shadow:inset 0 2px 5px rgba(0,0,0,.45)}
  .barfill{position:absolute;inset:0 auto 0 0;background:var(--blue);width:50%;
    transition:width .45s cubic-bezier(.22,.9,.28,1)}
  .barwrap .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-family:Anton,sans-serif;font-size:clamp(9px,1.5vh,13px);color:#08122f;z-index:2;
    background:#fff;border-radius:99px;padding:1px 6px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .pcts{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 9px;font-size:clamp(8px,1.4vh,12px);font-weight:900;z-index:1;
    text-shadow:0 1px 2px rgba(0,0,0,.5)}

  /* ---------- pitch ---------- */
  .pitch{
    position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 9%),
      repeating-linear-gradient(90deg,var(--grass-a) 0 9%,var(--grass-b) 9% 18%);
    border-bottom:2px solid var(--line);
  }
  /* stadium floodlight glow drifting from each corner */
  .pitch::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:
      radial-gradient(ellipse 60% 40% at 8% 0%, rgba(255,255,255,.16), transparent 62%),
      radial-gradient(ellipse 60% 40% at 92% 0%, rgba(255,255,255,.16), transparent 62%),
      radial-gradient(ellipse 90% 60% at 50% 105%, rgba(0,0,0,.35), transparent 70%);
  }
  .halfline{position:absolute;left:50%;top:0;bottom:0;width:3px;z-index:1;
    background:var(--chalk);transform:translateX(-50%);box-shadow:0 0 6px rgba(255,255,255,.4)}
  .centerc{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;z-index:1;
    transform:translate(-50%,-50%);border:3px solid var(--chalk);border-radius:50%;
    box-shadow:0 0 10px rgba(255,255,255,.25) inset}
  .centerc::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;
    background:var(--chalk);border-radius:50%;transform:translate(-50%,-50%)}
  .corner{position:absolute;width:16px;height:16px;border:2px solid var(--chalk);z-index:1;
    opacity:.7;border-radius:0 0 100% 0}
  .corner.tl{top:0;left:0}.corner.tr{top:0;right:0;transform:scaleX(-1)}
  .corner.bl{bottom:0;left:0;transform:scaleY(-1)}.corner.br{bottom:0;right:0;transform:scale(-1)}

  .pbox{position:absolute;top:22%;bottom:22%;width:11%;border:3px solid var(--chalk);z-index:1;
    box-shadow:0 0 8px rgba(255,255,255,.15) inset}
  .pbox.l{left:0;border-left:0}.pbox.r{right:0;border-right:0}
  /* net cross-hatch texture inside each goal box */
  .pbox::before{content:"";position:absolute;inset:8% 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.14) 0 1px, transparent 1px 11%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, transparent 1px 22%);
    opacity:.8}
  .pbox.l::before{right:0;left:auto;width:88%}
  .pbox.r::before{left:0;right:auto;width:88%}

  .side{position:absolute;top:50%;transform:translateY(-50%);z-index:3;text-align:center;width:26%}
  .side.a{left:3%}.side.b{right:3%}
  .side .crest{width:clamp(46px,11vh,110px);height:clamp(46px,11vh,110px);object-fit:contain;
    display:block;margin:0 auto;filter:drop-shadow(0 5px 8px rgba(0,0,0,.5))}
  .side .crest.chip{border-radius:14px;display:grid;place-items:center;font-family:Anton,sans-serif;
    font-size:clamp(16px,3.4vh,32px)}
  .side .flagmark{font-size:clamp(40px,9.5vh,96px);line-height:1;display:block}
  .side .nm{margin-top:5px;font-weight:900;font-size:clamp(10px,1.9vh,16px);
    background:rgba(6,12,32,.8);border-radius:7px;padding:2px 6px;display:inline-block;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side.win .crest{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}

  .ballwrap{position:absolute;top:50%;left:50%;z-index:4;
    transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.22,.9,.28,1)}
  .shadow{position:absolute;left:50%;top:calc(50% + clamp(15px,3.1vh,31px));
    width:clamp(22px,4.6vh,46px);height:clamp(6px,1.3vh,13px);
    background:radial-gradient(ellipse, rgba(0,0,0,.5), transparent 72%);
    transform:translate(-50%,-50%);border-radius:50%}
  .ball{position:absolute;top:50%;left:50%;width:clamp(26px,5.4vh,54px);height:clamp(26px,5.4vh,54px);
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
  .ball .spinner{transform-origin:32px 32px}
  .ballwrap.spin .spinner{animation:roll .5s cubic-bezier(.3,.1,.3,1)}
  @keyframes roll{to{transform:rotate(300deg)}}
  .ballwrap.spin .shadow{animation:hop .5s ease-out}
  @keyframes hop{0%{transform:translate(-50%,-50%) scaleX(1)}30%{transform:translate(-50%,-50%) scaleX(.7) translateY(-2px)}100%{transform:translate(-50%,-50%) scaleX(1)}}

  .timer{
    position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:6;
    background:rgba(6,12,32,.88);border:2px solid var(--line);border-radius:99px;
    padding:3px 14px;font-family:Anton,sans-serif;font-size:clamp(14px,2.8vh,28px);
    display:flex;align-items:center;gap:7px
  }
  .timer .dot{width:8px;height:8px;border-radius:50%;background:#3ddc72}
  .timer.low{color:#ff6b6b;border-color:#ff6b6b}
  .timer.low .dot{background:#ff6b6b;animation:blink .6s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  .hint{
    position:absolute;left:50%;bottom:7px;transform:translateX(-50%);z-index:5;white-space:nowrap;
    background:rgba(6,12,32,.8);border-radius:7px;padding:3px 10px;
    font-size:clamp(9px,1.6vh,13px);font-weight:700
  }

  /* goal popup */
  .goalpop{
    position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);z-index:9;
    background:rgba(6,12,32,.94);border:3px solid var(--gold);border-radius:14px;
    padding:9px 18px;text-align:center;display:none;animation:slam .45s cubic-bezier(.2,1.6,.4,1)
  }
  .goalpop.on{display:block}
  .goalpop .g{font-family:Anton,sans-serif;color:var(--gold);font-size:clamp(20px,4.2vh,42px);line-height:1}
  .goalpop .t{font-weight:900;font-size:clamp(13px,2.4vh,24px);margin-top:2px}
  .goalpop .u{opacity:.75;font-size:clamp(9px,1.6vh,13px);margin-top:2px}
  @keyframes slam{0%{transform:translate(-50%,-50%) scale(2);opacity:0}60%{transform:translate(-50%,-50%) scale(.95)}100%{transform:translate(-50%,-50%) scale(1)}}

  /* ---------- gift shelves ---------- */
  .shelves{flex:0 0 auto;display:flex;gap:5px;padding:6px;background:#0a1436;border-bottom:2px solid var(--line)}
  .shelf{flex:1;display:flex;gap:4px;justify-content:center;background:rgba(255,255,255,.05);
    border-radius:9px;padding:4px 3px;border:2px solid transparent}
  .shelf.a{border-color:rgba(59,160,255,.45)}
  .shelf.b{border-color:rgba(255,155,47,.45)}
  .gslot{flex:1;text-align:center;min-width:0}
  .gicon{width:clamp(20px,4vh,40px);height:clamp(20px,4vh,40px);object-fit:contain;display:block;margin:0 auto}
  .gicon.emo{font-size:clamp(17px,3.4vh,34px);line-height:1;display:grid;place-items:center}
  .gslot .c{font-size:clamp(8px,1.4vh,12px);font-weight:900;color:var(--gold);margin-top:1px}
  .gslot.hit{animation:hit .45s ease-out}
  @keyframes hit{30%{transform:scale(1.3)}}

  /* ---------- bracket ---------- */
  .bracket{
    flex:0 0 auto;height:42%;overflow:hidden;padding:5px 4px;display:flex;gap:2px;
    background:linear-gradient(180deg,#0a1436,#070d24);align-items:stretch
  }
  .bcol{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:2px;min-width:0}
  .bcol.mid{flex:1.15;justify-content:center;align-items:center;gap:2px}

  .tile{
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;
    padding:2px 1px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;
    overflow:hidden
  }
  .tile .tname{
    font-size:clamp(7px,1.3vh,12px);font-weight:800;line-height:1.1;text-align:center;
    letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.95
  }
  .tile .crest{width:clamp(14px,2.6vh,28px);height:clamp(14px,2.6vh,28px);object-fit:contain}
  .tile .crest.chip{border-radius:4px;display:grid;place-items:center;font-size:7px;font-weight:900}
  .tile .flagmark{font-size:clamp(12px,2.2vh,24px);line-height:1}
  .tile.empty{opacity:.3;justify-content:center;font-size:11px;font-weight:900}
  .tile.now{border-color:var(--gold);background:rgba(255,207,63,.18);box-shadow:0 0 0 1px var(--gold)}
  .tile.out{opacity:.32}
  .tile.new-win{animation:tileGlow 1.8s ease-out 2}
  @keyframes tileGlow{
    0%{box-shadow:0 0 0 0 rgba(255,207,63,0);background:rgba(255,207,63,0)}
    30%{box-shadow:0 0 14px 3px rgba(255,207,63,.9);background:rgba(255,207,63,.4)}
    100%{box-shadow:0 0 0 0 rgba(255,207,63,0);background:rgba(255,207,63,.06)}
  }

  .trophy{font-size:clamp(20px,4.4vh,46px);line-height:1}
  .trophy-crest{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,207,63,.7))}
  .trophy-crest.chip{border-radius:6px;display:grid;place-items:center;font-family:Anton,sans-serif;font-size:10px}
  .trophy-crest.flagmark{font-size:clamp(20px,3.6vh,32px)}
  .finalword{font-family:Anton,sans-serif;font-size:clamp(7px,1.2vh,11px);letter-spacing:.14em;
    color:var(--gold);opacity:.85}
  .champtile{font-weight:900;font-size:clamp(7px,1.25vh,11px);color:var(--gold);text-align:center;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- champion ---------- */
  #champ{
    position:absolute;inset:0;z-index:30;display:none;place-items:center;text-align:center;
    background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.4),rgba(0,0,0,.88))
  }
  #champ.on{display:grid}
  #champ .crestwrap{position:relative;display:inline-block;margin-bottom:4px}
  #champ .rays{position:absolute;left:50%;top:50%;width:clamp(140px,32vh,320px);height:clamp(140px,32vh,320px);
    transform:translate(-50%,-50%);z-index:-1;
    background:conic-gradient(from 0deg,transparent 0 10deg,rgba(255,207,63,.35) 10deg 18deg,transparent 18deg 36deg);
    animation:spinRays 8s linear infinite;border-radius:50%}
  @keyframes spinRays{to{transform:translate(-50%,-50%) rotate(360deg)}}
  #champCup{animation:champPop .7s cubic-bezier(.2,1.7,.4,1)}
  #champCup img,#champCup .flagmark,#champCup .chip{
    width:clamp(70px,17vh,170px);height:clamp(70px,17vh,170px);object-fit:contain;display:block;
    filter:drop-shadow(0 0 22px rgba(255,207,63,.75)) drop-shadow(0 8px 10px rgba(0,0,0,.5))
  }
  #champCup .chip{border-radius:22px;display:grid;place-items:center;font-family:Anton,sans-serif;
    font-size:clamp(24px,5.4vh,54px);width:clamp(70px,17vh,170px);height:clamp(70px,17vh,170px)}
  #champCup .flagmark{font-size:clamp(70px,17vh,170px);width:auto;height:auto;
    filter:drop-shadow(0 0 18px rgba(255,207,63,.7))}
  #champCup.cup{font-size:clamp(50px,13vh,130px)}
  @keyframes champPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  #champ .w{font-family:Anton,sans-serif;color:var(--gold);font-size:clamp(26px,6vh,60px);letter-spacing:.03em}
  #champ .n{font-weight:900;font-size:clamp(16px,3.4vh,34px);margin-top:4px}
  #confetti{position:absolute;inset:0;z-index:31;pointer-events:none}

  /* round-win banner: shown briefly whenever a match concludes and someone advances */
  .roundwin{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.5);z-index:22;
    background:rgba(6,12,32,.94);border:3px solid var(--gold);border-radius:16px;
    padding:14px 26px;text-align:center;display:none;opacity:0;
    transition:transform .5s cubic-bezier(.2,1.6,.4,1), opacity .3s
  }
  .roundwin.on{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
  #rwcrest{margin:0 auto 6px}
  #rwcrest img,#rwcrest .flagmark,#rwcrest .chip{
    width:clamp(44px,9vh,88px);height:clamp(44px,9vh,88px);object-fit:contain;display:block;margin:0 auto;
    filter:drop-shadow(0 0 12px rgba(255,207,63,.6))}
  #rwcrest .chip{border-radius:12px;display:grid;place-items:center;font-family:Anton,sans-serif;
    font-size:clamp(15px,3vh,28px)}
  #rwcrest .flagmark{font-size:clamp(44px,9vh,88px);width:auto;height:auto}
  .roundwin .rwname{font-weight:900;font-size:clamp(15px,2.8vh,26px);color:#fff}
  .roundwin .rwsub{font-size:clamp(10px,1.9vh,16px);color:var(--gold);font-weight:700;margin-top:2px;
    text-transform:uppercase;letter-spacing:.06em}

  .warn{
    position:absolute;inset:0;z-index:50;display:none;place-items:center;padding:24px;
    background:#070d24;text-align:center
  }
  .warn.on{display:grid}
  .warn h2{font-family:Anton,sans-serif;color:var(--gold);font-size:22px;margin-bottom:8px}
  .warn p{font-size:13px;opacity:.85;line-height:1.6;max-width:34ch;margin:0 auto}
  .warn code{background:#101c44;padding:2px 6px;border-radius:5px;font-size:12px}

  .off{position:absolute;right:8px;top:8px;z-index:40;background:#c0392b;border-radius:99px;
    padding:2px 9px;font-size:11px;font-weight:700;display:none}
  .off.on{display:block}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div class="off" id="off">מנותק</div>

  <div class="top">
    <div class="rd" id="roundLabel">GOAL CUP</div>
    <div class="ttl" id="title"></div>
  </div>

  <div class="tug">
    <div style="text-align:center">
    <div class="sc a" id="scoreA">0</div>
    <div style="font-size:clamp(7px,1.2vh,10px);color:var(--blue);opacity:.7;font-weight:700" id="coinsA"></div>
  </div>
    <div class="barwrap">
      <div class="barfill" id="barfill"></div>
      <div class="pcts"><span id="pctA">50%</span><span id="pctB">50%</span></div>
      <div class="vs">VS</div>
    </div>
    <div style="text-align:center">
    <div class="sc b" id="scoreB">0</div>
    <div style="font-size:clamp(7px,1.2vh,10px);color:var(--orange);opacity:.7;font-weight:700" id="coinsB"></div>
  </div>
  </div>

  <div class="pitch" id="pitch">
    <div class="halfline"></div>
    <div class="centerc"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="pbox l"></div><div class="pbox r"></div>
    <div class="timer" id="timer"><span class="dot"></span><span id="clock">0:00</span></div>
    <div class="side a" id="sideA"></div>
    <div class="side b" id="sideB"></div>

    <div class="ballwrap" id="ball">
      <div class="shadow"></div>
      <svg class="ball" viewBox="0 0 64 64">
        <defs>
          <radialGradient id="sphere" cx="36%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#eef0f4"/>
            <stop offset="100%" stop-color="#b9c0cf"/>
          </radialGradient>
          <clipPath id="ballClip"><circle cx="32" cy="32" r="29.2"/></clipPath>
        </defs>
        <g class="spinner">
          <circle cx="32" cy="32" r="30" fill="url(#sphere)" stroke="#1a2333" stroke-width="1.6"/>
          <!-- pentagon pattern, clipped so nothing can bleed past the ball's edge -->
          <g clip-path="url(#ballClip)">
            <g fill="#161d2c">
              <path d="M 32.0,23.4 L 40.2,29.3 L 37.1,39.0 L 26.9,39.0 L 23.8,29.3 Z"/>
              <path d="M 32.0,1.8 L 36.9,5.4 L 35.1,11.2 L 28.9,11.2 L 27.1,5.4 Z"/>
              <path d="M 60.7,22.7 L 58.8,28.5 L 52.7,28.5 L 50.8,22.7 L 55.8,19.1 Z"/>
              <path d="M 49.8,56.4 L 43.6,56.4 L 41.7,50.6 L 46.7,47.0 L 51.6,50.6 Z"/>
              <path d="M 14.2,56.4 L 12.4,50.6 L 17.3,47.0 L 22.3,50.6 L 20.4,56.4 Z"/>
              <path d="M 3.3,22.7 L 8.2,19.1 L 13.2,22.7 L 11.3,28.5 L 5.2,28.5 Z"/>
            </g>
            <g stroke="#1a2333" stroke-width="1.3" fill="none" opacity=".9">
              <line x1="32.0" y1="23.4" x2="32.0" y2="7.0"/>
              <line x1="40.2" y1="29.3" x2="55.8" y2="24.3"/>
              <line x1="37.1" y1="39.0" x2="46.7" y2="52.2"/>
              <line x1="26.9" y1="39.0" x2="17.3" y2="52.2"/>
              <line x1="23.8" y1="29.3" x2="8.2" y2="24.3"/>
            </g>
          </g>
          <ellipse cx="23" cy="19" rx="10" ry="6.5" fill="#fff" opacity=".5"/>
        </g>
      </svg>
    </div>

    <div class="hint" id="hint">שלחו מתנה כדי להזיז את הכדור</div>
    <div class="goalpop" id="goalpop">
      <div class="g">!גוווול</div><div class="t" id="goalTeam"></div><div class="u" id="goalUser"></div>
    </div>
  </div>

  <div class="shelves">
    <div class="shelf a" id="shelfA"></div>
    <div class="shelf b" id="shelfB"></div>
  </div>

  <div class="bracket" id="bracket"></div>

  <canvas id="confetti"></canvas>
  <div class="roundwin" id="roundwin">
    <div class="rwcrest" id="rwcrest"></div>
    <div class="rwname" id="rwname"></div>
    <div class="rwsub" id="rwsub">מתקדם לשלב הבא</div>
  </div>
  <div id="champ">
    <div>
      <div class="crestwrap" id="champCrestWrap">
        <div class="rays"></div>
        <div class="cup" id="champCup">&#127942;</div>
      </div>
      <div class="w">האלופה</div>
      <div class="n" id="champName"></div>
    </div>
  </div>

  <div class="warn" id="warn">
    <div>
      <h2>עוד לא מחובר</h2>
      <p>Open <code>firebase-config.js</code> and paste your Realtime Database URL, API key and a private room name. The setup guide walks through it step by step.</p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
/* ============================================================
   The overlay is the engine: it reads gift events, moves the
   ball, scores goals, ends matches and advances the bracket.
   Keep exactly ONE overlay open, or gifts get counted twice.
   ============================================================ */

let cfg = defaultConfig();
let st  = defaultState();
let champBoxKey = null;   // avoids rebuilding the champion crest on every render tick
let advancingId = null, advancingTimer = null;   // id of the team whose tile should glow after winning
let skew = 0;                       // firebase server clock - local clock
let dirty = false, saving = false;

const $ = id => document.getElementById(id);
const now = () => Date.now() + skew;

if (!CONFIGURED) $('warn').classList.add('on');

/* ---------- rendering ---------- */

function currentFixture(){
  const r = st.rounds[st.round];
  return r ? r[st.match] : null;
}

function render(){
  const fx = currentFixture();
  const A = fx && fx.a, B = fx && fx.b;

  $('title').textContent = cfg.title || '';
  $('roundLabel').textContent = st.phase === 'champion' ? 'GOAL CUP'
    : (st.rounds.length ? roundName(st.rounds, st.round) : 'GOAL CUP') +
      (fx ? ' \u00B7 ' + (st.match + 1) + '/' + st.rounds[st.round].length : '');

  $('sideA').innerHTML = A ? teamMarkHTML(A) + `<div class="nm">${esc(A.name)}</div>` : '';
  $('sideB').innerHTML = B ? teamMarkHTML(B) + `<div class="nm">${esc(B.name)}</div>` : '';
  $('sideA').classList.toggle('win', st.phase === 'ended' && st.scoreA > st.scoreB);
  $('sideB').classList.toggle('win', st.phase === 'ended' && st.scoreB > st.scoreA);

  $('scoreA').textContent = st.scoreA;
  $('scoreB').textContent = st.scoreB;

  const totalCoins = st.coinsA + st.coinsB;
  const share = totalCoins > 0 ? st.coinsA / totalCoins : 0.5;
  $('barfill').style.width = (share * 100).toFixed(1) + '%';
  const pA = Math.round(share * 100);
  const pB = 100 - pA;
  $('pctA').textContent = totalCoins > 0 ? pA + '%' : '50%';
  $('pctB').textContent = totalCoins > 0 ? pB + '%' : '50%';
  // coin totals shown in bar so you can see movement even without goals
  if ($('coinsA')) $('coinsA').textContent = totalCoins > 0 ? fmt(st.coinsA) : '';
  if ($('coinsB')) $('coinsB').textContent = totalCoins > 0 ? fmt(st.coinsB) : '';

  $('ball').style.left = (50 + Math.max(-1, Math.min(1, st.ball)) * 38) + '%';

  shelf('shelfA', cfg.leftGifts);
  shelf('shelfB', cfg.rightGifts);
  drawBracket();

  $('champ').classList.toggle('on', st.phase === 'champion');
  if (st.phase === 'champion' && st.champion){
    $('champName').textContent = st.champion.name;
    if (!champBoxKey || champBoxKey !== st.champion.id){
      champBoxKey = st.champion.id;
      const mark = teamMarkHTML(st.champion, 'crest');
      $('champCup').innerHTML = mark || '\u{1F3C6}';
      $('champCup').classList.toggle('cup', !mark);
    }
  } else {
    champBoxKey = null;
  }
  $('hint').textContent = st.phase === 'live' ? 'שלחו מתנה כדי להזיז את הכדור'
    : st.phase === 'ended' ? 'המשחק הבא מתחיל עוד רגע'
    : 'המשחק מתחיל בקרוב';
}

function shelf(id, gifts){
  const el = $(id);
  const key = (gifts || []).join('|');
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.innerHTML = (gifts || []).filter(Boolean).map(g =>
    `<div class="gslot" data-g="${esc(norm(g))}">${giftIconHTML(g)}<div class="c">${fmt(priceOf(g))}</div></div>`
  ).join('');
}

/* The bracket mirrors: the first half of the draw climbs in from the left,
   the second half from the right, and they meet at the trophy. */
function drawBracket(){
  const el = $('bracket'), R = st.rounds;
  if (!R.length){ el.innerHTML = ''; return; }

  const fx = currentFixture();
  const liveIds = fx ? [fx.a && fx.a.id, fx.b && fx.b.id] : [];
  const beaten = new Set();
  R.forEach(round => round.forEach(m => {
    if (m.winner){ if (m.a && m.a.id !== m.winner.id) beaten.add(m.a.id);
                   if (m.b && m.b.id !== m.winner.id) beaten.add(m.b.id); }
  }));

  const tile = t => {
    if (!t) return `<div class="tile empty">?</div>`;
    const cls = (liveIds.includes(t.id) ? ' now' : '') + (beaten.has(t.id) ? ' out' : '') +
                (advancingId === t.id ? ' new-win' : '');
    // short code in the tile (guaranteed to fit + guaranteed unique) - full
    // name still shows as a tooltip and everywhere else (live card, banners)
    const label = t.abbr || t.name.slice(0, 3).toUpperCase();
    return `<div class="tile${cls}" title="${esc(t.name)}">${teamMarkHTML(t)}<span class="tname">${esc(label)}</span></div>`;
  };

  // one match total: both teams flank the trophy
  if (R.length === 1){
    const m = R[0][0];
    el.innerHTML = `<div class="bcol">${tile(m.a)}</div>` + midColumn() + `<div class="bcol">${tile(m.b)}</div>`;
    return;
  }

  const half = arr => [arr.slice(0, Math.ceil(arr.length / 2)), arr.slice(Math.ceil(arr.length / 2))];

  const columns = side => {
    const cols = [];
    const first = half(R[0])[side];
    cols.push(first.flatMap(m => [m.a, m.b]));          // every entrant
    for (let r = 0; r < R.length - 1; r++) cols.push(half(R[r])[side].map(m => m.winner));
    return cols;
  };

  const L = columns(0), Rt = columns(1);
  const col = list => `<div class="bcol">${list.map(tile).join('')}</div>`;

  el.innerHTML = L.map(col).join('') + midColumn() + Rt.slice().reverse().map(col).join('');
}

function midColumn(){
  const champ = st.champion || (st.rounds.length ? st.rounds[st.rounds.length - 1][0].winner : null);
  const icon = champ
    ? `<div style="width:clamp(20px,3.6vh,34px);height:clamp(20px,3.6vh,34px);margin:0 auto">${teamMarkHTML(champ, 'trophy-crest')}</div>`
    : `<div class="trophy">\u{1F3C6}</div>`;
  return `<div class="bcol mid">
    ${icon}
    <div class="finalword">THE FINAL</div>
    ${champ ? `<div class="champtile">${esc(champ.name)}</div>` : ''}
  </div>`;
}

/* ---------- clock ---------- */

function tick(){
  const t = $('timer');
  let left = 0;
  if (st.phase === 'live') left = st.paused ? st.pausedLeft : Math.max(0, st.endsAt - now());
  else if (st.phase === 'ended') left = 0;
  const secs = Math.ceil(left / 1000);
  $('clock').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  t.classList.toggle('low', st.phase === 'live' && secs <= 10);

  if (st.phase === 'live' && !st.paused && left <= 0) endMatch();
  requestAnimationFrame(() => {});
}
setInterval(tick, 250);

/* ---------- the engine ---------- */

function sideForGift(name){
  const n = norm(name);
  if ((cfg.leftGifts  || []).some(g => norm(g) === n)) return 'a';
  if ((cfg.rightGifts || []).some(g => norm(g) === n)) return 'b';
  return null;
}

function applyEvent(ev){
  const gift = ev.gift || '';
  const side = sideForGift(gift);
  if (!side) return;

  const slot = document.querySelector(`#shelf${side === 'a' ? 'A' : 'B'} .gslot[data-g="${norm(gift)}"]`);
  if (slot) { slot.classList.add('hit'); setTimeout(() => slot.classList.remove('hit'), 460); }

  if (st.phase !== 'live' || st.paused) return;

  let coins = Number(ev.coins);
  if (!Number.isFinite(coins) || coins <= 0) coins = priceOf(gift);
  const count = Math.max(1, Number(ev.count) || 1);
  coins = coins * count;

  if (side === 'a') st.coinsA += coins; else st.coinsB += coins;
  st.ball += (side === 'a' ? 1 : -1) * (coins / Math.max(1, cfg.coinsPerGoal));
  $('ball').classList.remove('spin'); void $('ball').offsetWidth; $('ball').classList.add('spin');

  if (st.ball >= 1)      scoreGoal('a', ev.user);
  else if (st.ball <= -1) scoreGoal('b', ev.user);

  dirty = true;
  render();
}

function scoreGoal(side, user){
  const fx = currentFixture(); if (!fx) return;
  if (side === 'a') st.scoreA++; else st.scoreB++;
  st.ball = 0;
  const team = side === 'a' ? fx.a : fx.b;
  $('goalTeam').textContent = team ? team.name : '';
  $('goalUser').textContent = user ? '\u{1F381} ' + user : '';
  $('goalpop').classList.add('on');
  cheer();
  setTimeout(() => $('goalpop').classList.remove('on'), 3200);

  // golden goal: first goal of extra time settles it
  if (st.golden) endMatch();
  dirty = true;
}

function endMatch(){
  const fx = currentFixture(); if (!fx) return;

  if (st.scoreA === st.scoreB && cfg.goldenGoal && !st.golden){
    st.golden = true;
    st.endsAt = now() + 5 * 60 * 1000;      // runs until someone scores
    $('goalTeam').textContent = 'GOLDEN GOAL';
    $('goalUser').textContent = 'הגול הבא מנצח';
    $('goalpop').classList.add('on');
    setTimeout(() => $('goalpop').classList.remove('on'), 3500);
    dirty = true; save(); return;
  }

  const winner = st.scoreA >= st.scoreB ? fx.a : fx.b;   // a draw with golden goal off goes to A
  fx.winner = winner;
  st.golden = false;
  st.phase = 'ended';
  autoAdvanceByes(st.rounds);
  save();

  const isFinal = !nextFixture(st.rounds) && st.rounds.length &&
                   st.rounds[st.rounds.length - 1][0].winner === winner;

  if (!isFinal) showRoundWin(winner);   // final gets the big champion screen instead

  const next = nextFixture(st.rounds);
  if (!next){
    setTimeout(() => { st.phase = 'champion'; st.champion = winner; confettiBurst(); cheer(); save(); render(); }, 3500);
  } else if (cfg.autoNext){
    setTimeout(() => startFixture(next), Math.max(3, cfg.nextDelay || 8) * 1000);
  }
  render();
  advancingId = winner.id;
  clearTimeout(advancingTimer);
  advancingTimer = setTimeout(() => { advancingId = null; drawBracket(); }, 3700);
}

/* Brief celebration banner shown whenever a team wins a match and moves on. */
function showRoundWin(team){
  $('rwcrest').innerHTML = teamMarkHTML(team, 'rwmark') || '';
  $('rwname').textContent = team.name;
  const left = st.rounds.length - st.round - 1;   // rounds remaining after this one, before finding next round index shift
  $('rwsub').textContent = 'עולה לשלב הבא';
  $('roundwin').classList.add('on');
  confettiBurst(70);
  cheer();
  setTimeout(() => $('roundwin').classList.remove('on'), 2600);
}

function startFixture(fx){
  st.round = fx.round; st.match = fx.match;
  st.scoreA = st.scoreB = 0; st.coinsA = st.coinsB = 0;
  st.ball = 0; st.golden = false; st.paused = false;
  st.phase = 'live';
  st.startedAt = now();
  st.endsAt = st.startedAt + Math.max(10, cfg.duration) * 1000;
  save(); render();
}

/* ---------- saving (throttled so we don't hammer the database) ---------- */

function save(){ dirty = true; }
setInterval(() => {
  if (!dirty || saving || !CONFIGURED) return;
  dirty = false; saving = true;
  refs.state.set(st).catch(() => {}).then(() => { saving = false; });
}, 400);

/* ---------- confetti + sound ---------- */

const cv = $('confetti'), cx = cv.getContext('2d');
let bits = [];
function sizeCv(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', sizeCv); sizeCv();
function confettiBurst(count){
  const n = count || 200;
  const cols = ['#ffcf3f', '#3ba0ff', '#ff9b2f', '#ffffff'];
  for (let i = 0; i < n; i++) bits.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6,
    w: 5 + Math.random() * 8, h: 8 + Math.random() * 12, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3,
    rot: Math.random() * 6, vr: -.2 + Math.random() * .4, c: cols[i % cols.length] });
}
(function loop(){
  cx.clearRect(0, 0, cv.width, cv.height);
  bits = bits.filter(b => b.y < cv.height + 30);
  for (const b of bits){ b.x += b.vx; b.y += b.vy; b.rot += b.vr;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.rot); cx.fillStyle = b.c;
    cx.fillRect(-b.w/2, -b.h/2, b.w, b.h); cx.restore(); }
  requestAnimationFrame(loop);
})();

let ac = null;
function cheer(){
  if (!cfg.sound) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  const len = ac.sampleRate * 1.6, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++)
    d[i] = (Math.random() * 2 - 1) * Math.min(1, i / (ac.sampleRate * .1)) * Math.pow(1 - i / len, 1.6) * .45;
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100;
  src.connect(f).connect(ac.destination); src.start();
}
document.addEventListener('click', () => { if (ac && ac.state === 'suspended') ac.resume(); });

/* ---------- wiring ---------- */

loadGiftPrices().then(() => {
  render();
  if (!CONFIGURED) return;

  refs.offset.on('value', s => { skew = s.val() || 0; });

  refs.config.on('value', s => {
    cfg = Object.assign(defaultConfig(), s.val() || {});
    document.body.dataset.layout = cfg.layout || '9:16';
    $('shelfA').dataset.key = ''; $('shelfB').dataset.key = '';
    render();
  });

  // the panel writes the team list; a new seed means rebuild the bracket
  refs.setup.on('value', s => {
    const v = s.val();
    if (!v || !v.teams || !v.teams.length) return;
    if (v.seed === st.seed) return;
    st = defaultState();
    st.seed = v.seed;
    st.rounds = buildBracket(v.teams);
    st.phase = 'lobby';
    const n = nextFixture(st.rounds);
    if (n) { st.round = n.round; st.match = n.match; }
    save(); render();
  });

  // one-off commands from the panel
  refs.commands.on('child_added', s => {
    const c = (s.val() || {}).cmd;
    s.ref.remove();
    if (c === 'start'){ const n = nextFixture(st.rounds); if (n) startFixture(n); }
    else if (c === 'pause'){ st.paused = true; st.pausedLeft = Math.max(0, st.endsAt - now()); save(); render(); }
    else if (c === 'resume'){ st.paused = false; st.endsAt = now() + st.pausedLeft; save(); render(); }
    else if (c === 'end'){ endMatch(); }
    else if (c === 'plusA'){ st.scoreA++; st.ball = 0; st.coinsA += cfg.coinsPerGoal; save(); render(); }
    else if (c === 'plusB'){ st.scoreB++; st.ball = 0; st.coinsB += cfg.coinsPerGoal; save(); render(); }
    else if (c === 'restart'){ const fx = currentFixture(); if (fx) startFixture({ round: st.round, match: st.match }); }
  });

  // pick up a match already in progress if the overlay was reopened
  refs.state.once('value', s => {
    const v = s.val();
    if (v && v.rounds && v.rounds.length){
      st = Object.assign(defaultState(), v);
      if (st.phase === 'live' && st.endsAt < now()) st.phase = 'ended';
      render();
    }
  });

    db.ref('.info/connected').on('value', s => $('off').classList.toggle('on', !s.val()));
});
</script>
</body>
</html>
